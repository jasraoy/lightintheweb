<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light in the Web | Login</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>
    <div class="background-glow glow-three"></div>

    <header class="header">
        <a href="index.html" class="logo">
            <span class="logo-icon">✦</span>
            <span>Light in the <span class="logo-highlight">Web</span></span>
        </a>
    </header>

    <main id="home" class="main-container">

        <section class="login-section">

            <div class="login-card">

                <h2>Welcome Back!</h2>

                <p class="login-subtitle">
                    Log in to explore and let your light shine.
                </p>

                <form id="loginForm">

                    <div class="input-group">
                        <label for="username">Username</label>

                        <div class="input-wrapper">
                            <input
                                type="text"
                                id="username"
                                placeholder="Enter your username"
                                required
                            >
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>

                        <div class="input-wrapper">
                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                                aria-label="Show password"
                            >
                                Show
                            </button>
                        </div>
                    </div>

                    <p id="errorMessage" class="error-message"></p>

                    <button type="submit" class="login-button">
                        <span>Log in</span>
                    </button>

                </form>

            </div>

        </section>

    </main>

    <footer class="footer">
        <p>© 2026 Light in the Web. All Rights Reserved.</p>
        <p>Made with purpose, guided by faith. <span>✦</span></p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
